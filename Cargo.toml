[package]
name = "ocdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native GPUI desktop client for the opencode coding agent"
license = "MIT"
repository = "https://github.com/bmz1/ocdesk"
readme = "README.md"
publish = false

[dependencies]
# gpui-kit 0.9.0 bundles gpui-pre =0.3.11 (snapshot of zed@f816e1f), the native
# platform crate and gpui-component. Pinned exactly: any snapshot can change GPUI's API.
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "signal", "fs"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.9"
dirs = "6"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
libc = "0.2"
# Terminal tab: opencode PTYs over a WebSocket, emulated locally.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
alacritty_terminal = "0.25"
base64 = "0.22"
# Highlighting outside markdown (diffs, file reads): the same syntect and
# syntax set gpui-component's `syntect` feature already builds.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSBundle", "NSString"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
