[package]
name = "ocdesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native GPUI desktop client for the opencode coding agent"
license = "MIT"
publish = false

[dependencies]
# gpui-kit 0.9.0 bundles gpui-pre =0.3.11 (snapshot of zed@f816e1f), the native
# platform crate and gpui-component. Pinned exactly: any snapshot can change GPUI's API.
gpui-kit = { version = "=0.9.0" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
dirs = "6"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
libc = "0.2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
